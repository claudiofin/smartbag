# ⚠️ Every option here is switched on because a specific HAL function needs it.
# Nothing is enabled "in case".

# sb_hal_zephyr.c: gpio_set / gpio_get / mux_select
CONFIG_GPIO=y

# spi_xfer — the two radars and the camera share one bus, chip selects are
# GPIOs because there are three of them and one CSN pin.
CONFIG_SPI=y

# i2c_write / i2c_read — the PMIC, the IMU and the time-of-flight sensor
CONFIG_I2C=y

# adc_read — the six transimpedance outputs behind the multiplexer
CONFIG_ADC=y

# The GATT layer sb_ble.c encodes for. ⚠️ sb_ble.c produces the BYTES; this is
# the stack that carries them, and it is the one part of the firmware the host
# tests cannot exercise.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="SmartBag"
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_ATT_PREPARE_COUNT=2
# 247 bytes is what app/protocol.js assumes when it fragments an inventory.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# The ledger survives a reset: it is what the app reads to know what is in the
# bag, and losing it on every battery scare would make the inventory a lie.
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192

# ⭐ The logic below the HAL is plain C99 with no libc surprises; it is built
# with the same warnings the host tests use.
CONFIG_COMPILER_WARNINGS_AS_ERRORS=y

# Deep sleep is the whole power budget: thermal/budget.py charges 25 uW of
# "deep sleep" against the average, which is System OFF with RAM retention.
CONFIG_PM=y
CONFIG_PM_DEVICE=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2
